name: Wallet API Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  wallet-api-tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://challenge.test.local/challenge/api/v1
      USERNAME: test-user
      PASSWORD: test-password
      SERVICE_ID: wallet-service
      USE_MOCKS: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Wallet API Tests
        run: npm run test:wallet

      - name: Upload Mochawesome Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: reports/